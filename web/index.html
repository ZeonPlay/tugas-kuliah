<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172631" />
    <meta name="description" content="Atur tugas kuliah, pantau deadline, buka kalender, dan temukan materi dalam satu ruang kerja." />
    <title>Tugas Kuliah — Study Desk</title>
    <script>
      try {
        const saved = localStorage.getItem("tugas-kuliah-theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.dataset.theme = saved;
        }
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
